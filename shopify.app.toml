# Fill client_id and application_url, or run `shopify app config link`.
name = "Product Reviews"
client_id = "YOUR_CLIENT_ID"
application_url = "https://your-app.example.com"
embedded = true

[access_scopes]
scopes = "write_products"

[auth]
redirect_urls = ["https://your-app.example.com/auth/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks"

# Storefront requests to /apps/reviews/* are forwarded to <application_url>/proxy/*
[app_proxy]
url = "https://your-app.example.com/proxy"
subpath = "reviews"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
